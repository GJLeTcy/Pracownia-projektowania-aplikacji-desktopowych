<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Magazyn Elektro-Bud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body class="bg-dark">
    <div id="app" class="mx-auto bg-light vh-100 p-3 overflow-auto" style="max-width: 600px;">
        <h1 class="mb-3">Magazyn Elektro-Bud</h1>
        
        <div class="mb-3">
            <label for="todoInputField" class="form-label">Nazwa produktu</label>
            <input type="text" id="todoInputField" class="form-control mb-2" placeholder="Wpisz nazwę produktu..."/>
            
            <label for="productCategory" class="form-label">Kategoria</label>
            <select id="productCategory" class="form-select mb-2">
                <option value="Narzędzia">Narzędzia</option>
                <option value="Materiały">Materiały</option>
                <option value="Akcesoria">Akcesoria</option>
            </select>
            
            <button type="button" id="todoAddButton" class="btn btn-success text-white">Dodaj produkt</button>
        </div>

        <div id="todoContainer" class="mt-3"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous" defer></script>
    <script src="public/main.js" defer></script>
</body>
</html>
